name: Build TuneFetch

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter yt-dlp pillow mutagen imageio-ffmpeg certifi truststore

      - name: Build (Windows / macOS - windowed)
        if: runner.os != 'Linux'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name TuneFetch --collect-data customtkinter --collect-data imageio_ffmpeg --hidden-import=yt_dlp tunefetch.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: python -m PyInstaller --noconfirm --onefile --name TuneFetch --collect-data customtkinter --collect-data imageio_ffmpeg --hidden-import=yt_dlp tunefetch.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneFetch-${{ runner.os }}
          path: dist/*
